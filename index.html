<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pick a Vibe 💖</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- EmailJS Library for direct automatic sending -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #181016; /* Dark moody romantic theme */
      color: #ffffff;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 1050px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: #ffd1dc;
      margin-bottom: 8px;
    }

    .header p {
      color: #cbb8c4;
      font-size: 1rem;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    /* Card Base Styling */
    .vibe-card {
      background: #231920;
      border: 1px solid rgba(255, 182, 193, 0.15);
      border-radius: 16px;
      padding: 24px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
    }

    /* Hover Lift Effect */
    .vibe-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 105, 180, 0.4);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 105, 180, 0.15);
    }

    /* Selected Card State */
    .vibe-card.selected {
      border: 2px solid #ff69b4;
      background: linear-gradient(145deg, #2a1b26, #1f141d);
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.35), inset 0 0 10px rgba(255, 105, 180, 0.1);
      transform: scale(1.02);
    }

    /* Selected Heart Badge */
    .vibe-card.selected::after {
      content: '💖';
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 1.1rem;
      animation: popIn 0.3s ease-out;
    }

    .vibe-tag {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #ffb6c1;
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .vibe-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .vibe-desc {
      font-size: 0.9rem;
      line-height: 1.55;
      color: #d1c4cd;
    }

    /* Submit Section */
    .action-container {
      text-align: center;
      margin-top: 40px;
    }

    .send-btn {
      background: linear-gradient(135deg, #ff69b4, #db2777);
      color: #ffffff;
      border: none;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Quicksand', sans-serif;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
      transition: all 0.3s ease;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Pick a vibe for our special day 💗</h1>
      <p>Whatever you choose, as long as I'm with you, it's going to be amazing. 🥰</p>
    </div>

    <div class="grid" id="vibeGrid">
      <!-- Dynamic Cards Injected via JS -->
    </div>

    <div class="action-container">
      <button class="send-btn" id="sendBtn" onclick="sendChoice()">Lock in my choice! ✨</button>
    </div>
  </div>

  <script>
    // 1. Initialize EmailJS with your Public Key
    (function() {
      emailjs.init("YOUR_PUBLIC_KEY"); // 👈 Replace with your EmailJS Public Key
    })();

    // 2. Options Data
    const vibeOptions = [
      { id: "01", tag: "VIBE 01", title: "Cozy & Relaxed 🌷", desc: "A warm, stylish bakery-bistro with comfort food classics, specialty coffee, and decadent desserts just for us." },
      { id: "02", tag: "VIBE 02", title: "Speakeasy Romance ✨", desc: "An enchanting, moody spot with ambient lighting, artful interiors, and amazing signature dishes." },
      { id: "03", tag: "VIBE 03", title: "Fancy & Elegant ✨", desc: "A sophisticated dining space with modern interiors, upscale continental cuisine, and cocktail pairings." },
      { id: "04", tag: "VIBE 04", title: "Steak & Wine 🥩", desc: "A dedicated steakhouse experience centered around prime beef cuts, rich savory sauces, and classic sides." },
      { id: "05", tag: "VIBE 05", title: "Candlelit Evening 🌹", desc: "An intimate European-inspired dining nook featuring refined French-accented dishes and a great wine list." },
      { id: "06", tag: "VIBE 06", title: "Chic & Aesthetic 💕", desc: "A beautiful, photogenic spot that perfectly balances indulgent comfort food with lighter options." },
      { id: "07", tag: "VIBE 07", title: "Pasta & Date Night 🍝", desc: "A charming Italian trattoria serving freshly handcrafted pasta, traditional risotto, and classic desserts." },
      { id: "08", tag: "VIBE 08", title: "Heritage & Charm 🌸", desc: "A restored historic home offering refined Spanish-Filipino fusion dishes in a classy, romantic atmosphere." },
      { id: "09", tag: "VIBE 09", title: "Rooftop & City Lights 🍸✨", desc: "A sleek open-air spot with breathtaking evening views, premium grilled dishes, and handcrafted cocktails." }
    ];

    let selectedVibe = null;

    // 3. Render Cards
    const grid = document.getElementById("vibeGrid");

    vibeOptions.forEach(vibe => {
      const card = document.createElement("div");
      card.className = "vibe-card";
      card.onclick = () => selectCard(card, vibe);

      card.innerHTML = `
        <div class="vibe-tag">${vibe.tag}</div>
        <div class="vibe-title">${vibe.title}</div>
        <div class="vibe-desc">${vibe.desc}</div>
      `;

      grid.appendChild(card);
    });

    // 4. Handle Selection
    function selectCard(cardElement, vibeData) {
      document.querySelectorAll(".vibe-card").forEach(c => c.classList.remove("selected"));
      cardElement.classList.add("selected");
      selectedVibe = vibeData;
    }

    // 5. Direct Background Sending via EmailJS
    function sendChoice() {
      if (!selectedVibe) {
        alert("Please tap one of the vibes first! 💖");
        return;
      }

      const btn = document.getElementById("sendBtn");
      btn.innerText = "Sending... 💖";
      btn.disabled = true;

      const templateParams = {
        vibe_title: selectedVibe.title,
        vibe_tag: selectedVibe.tag,
        vibe_desc: selectedVibe.desc,
        date: "August 28, 2026"
      };

      emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", templateParams)
        .then(function() {
          alert("🎉 Choice sent successfully! Can't wait for our date! 🥰");
          btn.innerText = "Sent! ✨";
        }, function(error) {
          console.error("EmailJS Error:", error);
          alert("Oops! Something went wrong behind the scenes. Please try clicking again!");
          btn.innerText = "Lock in my choice! ✨";
          btn.disabled = false;
        });
    }
  </script>
</body>
</html>
